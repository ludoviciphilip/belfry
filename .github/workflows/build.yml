name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test -p belfry-proto -p belfryd
      - name: End-to-end (two hosts in network namespaces, no root)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bash scripts/fetch-engine.sh linux
          cargo build -p belfryd
          unshare -rn bash scripts/e2e-netns.sh | tee e2e.txt
          grep -q "TCP: b'pong:tcp-hunter'" e2e.txt
          grep -q "UDP: b'pong:udp-hunter'" e2e.txt
          grep -q "recuperou após .*: 1" e2e.txt
          grep -q "not from the room network" e2e.txt

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            engine: linux
          - os: windows-latest
            engine: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: npm ci
      - name: Engine (EasyTier, checksum-pinned)
        shell: bash
        run: bash scripts/fetch-engine.sh ${{ matrix.engine }}
      - name: belfryd sidecar
        shell: bash
        run: bash scripts/build-daemon.sh release
      - name: Bundle (and draft a release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app only installs updates signed with it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Belfry ${{ github.ref_name }}"
          releaseBody: "See the README for install steps. Windows: run the -setup.exe. Linux: AppImage, .deb or .rpm."
          releaseDraft: true
      - uses: actions/upload-artifact@v5
        with:
          name: belfry-${{ matrix.engine }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/appimage/*.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: ignore
